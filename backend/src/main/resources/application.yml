spring:
  application:
    name: station-api

  cache:
    type: ${SPRING_CACHE_TYPE:simple}
    cache-names: produits,cuves,fournisseurs

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000ms

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/station_db}
    username: ${SPRING_DATASOURCE_USERNAME:station_user}
    password: ${SPRING_DATASOURCE_PASSWORD:station_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:false}

station:
  iot:
    simulator:
      enabled: ${IOT_SIMULATOR_ENABLED:false}

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
