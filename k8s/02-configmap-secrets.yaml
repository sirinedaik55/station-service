apiVersion: v1
kind: ConfigMap
metadata:
  name: station-config
  namespace: station-service
data:
  SPRING_PROFILES_ACTIVE: "prod"
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres-service:5432/station_db"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  RABBITMQ_HOST: "rabbitmq-service"
  RABBITMQ_PORT: "5672"
  IOT_SIMULATOR_ENABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: station-secrets
  namespace: station-service
type: Opaque
stringData:
  POSTGRES_DB: "station_db"
  POSTGRES_USER: "station_user"
  POSTGRES_PASSWORD: "station_secure_password_2026"
  JWT_SECRET: "StationSecretKeyVeryLongForProductionEnvironmentSecurity2026WithHS256"
